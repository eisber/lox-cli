[package]
name = "lox-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["Markus Cozowicz <markus@cozowicz.com>"]
description = "Headless Loxone toolkit — archive/configuration/statistics codecs and optional clock/auth profiles"
repository = "https://github.com/eisber/lox-cli"
license = "AGPL-3.0-or-later AND LicenseRef-Commercial"
readme = "README.md"

[dependencies]
crc32fast = "1.5.0"
lz4_flex = "0.13.0"
zip = "2"
quick-xml = { version = "0.37", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"], optional = true }
hmac = { version = "0.12", optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
xmltree = { version = "0.12.0", features = ["attribute-order"], optional = true }
chrono = { version = "0.4", features = ["clock"], optional = true }
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", features = ["alloc"], optional = true }
base64 = { version = "0.22", optional = true }

[features]
default = []
configuration-editor = ["dep:xmltree", "dep:chrono"]
# UNSTABLE, doc-hidden migration adapter for the legacy binary, never foreign API.
unstable-legacy-cli-editor = ["configuration-editor"]
legacy-wsx = []
legacy-token-reply = ["dep:serde_json"]
legacy-token-aes = ["dep:aes", "dep:cbc", "dep:base64"]
auth-hash = ["dep:hmac", "dep:sha1", "dep:sha2", "dep:hex"]
configuration-xml = ["dep:quick-xml", "configuration-editor"]
statistics-xml = ["dep:quick-xml"]
firmware-metadata = ["dep:quick-xml"]
structure-json = ["dep:serde_json"]
runtime = ["dep:reqwest", "dep:serde_json", "dep:tokio"]
runtime-blocking = ["runtime"]

[dev-dependencies]
httpmock = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[[test]]
name = "configuration_editor"
required-features = ["configuration-editor"]

[[test]]
name = "user_inventory"
required-features = ["configuration-xml"]

[[test]]
name = "device_inventory"
required-features = ["configuration-xml"]

[[test]]
name = "control_inventory"
required-features = ["configuration-xml"]

[[test]]
name = "room_inventory"
required-features = ["configuration-xml"]

[[test]]
name = "config_summary"
required-features = ["configuration-xml"]

[[test]]
name = "statistics_series"
required-features = ["statistics-xml"]

[[test]]
name = "config_diff"
required-features = ["configuration-xml"]

[[test]]
name = "runtime_overlay"
required-features = ["configuration-xml"]

[[test]]
name = "control_catalog"
required-features = ["structure-json"]

[[test]]
name = "autopilot_catalog"
required-features = ["structure-json"]

[[test]]
name = "legacy_wsx"
required-features = ["legacy-wsx"]

[[test]]
name = "firmware_metadata"
required-features = ["firmware-metadata"]

[[test]]
name = "legacy_token_reply"
required-features = ["legacy-token-reply"]

[[test]]
name = "legacy_token_aes"
required-features = ["legacy-token-aes"]
