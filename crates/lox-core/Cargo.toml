[package]
name = "lox-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["Markus Cozowicz <markus@cozowicz.com>"]
description = "Headless Loxone toolkit — archive/configuration/statistics codecs and optional clock/auth profiles"
repository = "https://github.com/eisber/lox-cli"
license = "AGPL-3.0-or-later AND LicenseRef-Commercial"
readme = "README.md"

[dependencies]
crc32fast = "1.5.0"
lz4_flex = "0.13.0"
zip = "2"
quick-xml = { version = "0.37", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"], optional = true }
hmac = { version = "0.12", optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }

[features]
default = []
legacy-wsx = []
auth-hash = ["dep:hmac", "dep:sha1", "dep:sha2", "dep:hex"]
configuration-xml = ["dep:quick-xml"]
statistics-xml = ["dep:quick-xml"]
structure-json = ["dep:serde_json"]
runtime = ["dep:reqwest", "dep:serde_json", "dep:tokio"]
runtime-blocking = ["runtime"]

[dev-dependencies]
httpmock = "0.7"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[[test]]
name = "control_inventory"
required-features = ["configuration-xml"]

[[test]]
name = "room_inventory"
required-features = ["configuration-xml"]

[[test]]
name = "config_summary"
required-features = ["configuration-xml"]

[[test]]
name = "statistics_series"
required-features = ["statistics-xml"]

[[test]]
name = "config_diff"
required-features = ["configuration-xml"]

[[test]]
name = "control_catalog"
required-features = ["structure-json"]

[[test]]
name = "legacy_wsx"
required-features = ["legacy-wsx"]
