[workspace]
members = [".", "lox-sim"]

[package]
name = "lox-cli"
version = "0.12.0"
edition = "2024"
rust-version = "1.91"
authors = ["Markus Cozowicz <markus@cozowicz.com>"]
description = "Loxone Config-as-Code CLI — download, inspect, edit, and push Loxone configs"
repository = "https://github.com/eisber/lox-cli"
homepage = "https://github.com/eisber/lox-cli"
keywords = ["loxone", "smarthome", "home-automation", "cli", "config-as-code"]
categories = ["command-line-utilities", "network-programming"]
license = "AGPL-3.0-or-later AND LicenseRef-Commercial"
readme = "README.md"

[[bin]]
name = "lox"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env", "suggestions"] }
clap_complete = "4"
reqwest = { version = "0.12", features = ["blocking", "cookies", "json", "rustls-tls-manual-roots"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "5"
anyhow = "1"

# WebSocket / token auth deps
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
openssl = "0.10"
webpki-roots = "0.26"
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
rand = "0.8"
chrono = { version = "0.4", features = ["clock"] }
byteorder = "1"
uuid = { version = "1", features = ["v4"] }

# Backup deps
suppaftp = "6"
zip = "2"
quick-xml = "0.37"
crc32fast = "1.5.0"
xmltree = { version = "0.12.0", features = ["attribute-order"] }
lz4_flex = "0.13.0"
lox-sim = { path = "lox-sim", version = "0.1.0" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
httpmock = "0.7"
tokio-test = "0.4"

[features]
vendored-openssl = ["openssl/vendored"]
