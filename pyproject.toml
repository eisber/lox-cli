[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "lox-archive"
version = "0.1.0"
description = "Generated native lox-core archive, strict clock and pure control operations (experimental)"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later AND LicenseRef-Commercial"
license-files = [
    "LICENSE",
    "LICENSE-AGPL",
    "LICENSE-COMMERCIAL",
    "NOTICE",
    "crates/lox-bindings/THIRD_PARTY_NOTICES",
    "crates/lox-bindings/licenses/MPL-2.0.txt",
]
readme = "docs/toolkit-archive-bindings.md"

[tool.maturin]
bindings = "uniffi"
manifest-path = "crates/lox-bindings/Cargo.toml"
include = ["lox_archive_async.py"]
