[package]
name = "lox-sim"
version = "0.1.0"
edition = "2021"
description = "Loxone Miniserver SPS simulator — differentiable, high-performance"
license = "AGPL-3.0-or-later"

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
xmltree = "0.10"

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sim_bench"
harness = false
