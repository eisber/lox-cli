[package]
name = "lox-sim"
version = "0.1.0"
edition = "2021"
description = "Loxone Miniserver SPS simulator — offline circuit testing for 195 block types"
license = "AGPL-3.0-or-later"
repository = "https://github.com/eisber/lox-cli"
keywords = ["loxone", "simulator", "smarthome", "sps"]

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
xmltree = "0.10"

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sim_bench"
harness = false
