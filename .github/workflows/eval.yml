name: Eval

on:
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday 3am UTC
  workflow_dispatch:
    inputs:
      agent:
        description: 'Agent backend'
        default: 'opencode'
        type: choice
        options:
          - opencode
          - copilot
          - claude
          - builtin
      model:
        description: 'Model to evaluate'
        default: 'gpt-4o'
        type: choice
        options:
          - gpt-4o
          - gpt-4o-mini
          - o4-mini
      filter:
        description: 'Case filter (empty=all synthetic cases)'
        default: 'synthetic'
        type: string
      max_cases:
        description: 'Max cases to run'
        default: '20'
        type: string

permissions:
  contents: read
  models: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: eval-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build lox-cli
        run: cargo build --release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install openai

      - name: Install OpenCode
        if: inputs.agent == 'opencode' || inputs.agent == ''
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Run eval
        id: eval
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_BASE_URL: https://models.inference.ai.azure.com
          OPENAI_API_KEY: ${{ secrets.GITHUB_TOKEN }}
          LOX_TELEMETRY: '0'
        run: |
          export PATH="${{ github.workspace }}/target/release:$PATH"
          python3 tests/eval/scripts/eval-agent.py \
            --all \
            --agent "${{ inputs.agent || 'opencode' }}" \
            --model "${{ inputs.model || 'gpt-4o' }}" \
            --section "${{ inputs.filter || 'synthetic' }}" \
            --max-cases "${{ inputs.max_cases || '20' }}" \
            --output tests/eval/reports/ci-eval-report.json

      - name: Print summary
        if: always()
        run: |
          if [ -f tests/eval/reports/ci-eval-report.json ]; then
            python3 tests/eval/scripts/eval-agent.py --report tests/eval/reports/ci-eval-report.json | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ inputs.agent || 'opencode' }}-${{ inputs.model || 'gpt-4o' }}
          path: tests/eval/reports/ci-eval-report.json
