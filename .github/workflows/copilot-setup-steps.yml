name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Rust Docker environment
        run: |
          docker pull rust:1.91-bookworm
          docker volume create lox-cargo-registry
          docker volume create lox-cargo-target
          docker run --rm \
            --volume "$PWD:/work" \
            --volume lox-cargo-registry:/usr/local/cargo/registry \
            --volume lox-cargo-target:/work/target \
            --workdir /work \
            rust:1.91-bookworm \
            cargo fetch --locked
          docker run --rm rust:1.91-bookworm rustc --version
